<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Solicitud OIRS - CESFAM Futrono</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cesfam: {
                            blue: '#005baa',
                            green: '#00a650',
                            light: '#f0f9ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col" style="visibility:hidden">
    <nav class="bg-cesfam-blue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <img src="logo.png" alt="Logo CESFAM" class="h-10 w-auto bg-white p-1 rounded-lg">
                    <span class="font-heading font-bold text-lg">Portal Paciente</span>
                </div>
                <a href="dashboard.html" class="text-blue-100 hover:text-white flex items-center gap-2 text-sm"><i class="fas fa-arrow-left"></i> Volver a mi panel</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto w-full px-4 sm:px-6 py-8">
        <div id="cargando" class="text-slate-500 text-center py-12">Cargando...</div>
        <div id="contenido" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex flex-wrap justify-between items-start gap-3">
                    <div>
                        <p id="numero" class="text-sm font-semibold text-cesfam-blue"></p>
                        <h1 id="asunto" class="text-2xl font-heading font-bold text-slate-900 mt-1"></h1>
                    </div>
                    <span id="estado" class="inline-block py-1 px-3 rounded-md text-xs font-semibold"></span>
                </div>
                <p id="meta" class="text-sm text-slate-500 mt-2"></p>
                <h2 class="text-sm font-semibold text-slate-700 mt-5 mb-1">Lo que escribiste</h2>
                <p id="descripcion" class="text-slate-700 whitespace-pre-line"></p>
                <div id="bloque-solicita" class="hidden">
                    <h2 class="text-sm font-semibold text-slate-700 mt-5 mb-1">Lo que solicitas</h2>
                    <p id="solicita" class="text-slate-700 whitespace-pre-line"></p>
                </div>
            </div>
            <div id="bloque-respuesta" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-sm font-semibold text-slate-700 mb-1">Respuesta del CESFAM</h2>
                <p id="respuesta" class="text-slate-700 whitespace-pre-line"></p>
            </div>
        </div>
        <p id="error" class="hidden text-center text-red-700 py-12" role="alert"></p>
    </main>

    <script>
        // Verifica la sesión; sin sesión válida vuelve al login.
        async function verificarSesion() {
            try {
                const resp = await fetch('/api/auth/me', { credentials: 'same-origin' });
                if (!resp.ok) throw new Error('Sin sesión');
            } catch (e) {
                window.location.replace('login.html');
                return false;
            }
            document.body.style.visibility = 'visible';
            return true;
        }
        window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

        const TIPOS = { reclamo: 'Reclamo', solicitud: 'Solicitud', sugerencia: 'Sugerencia', felicitacion: 'Felicitación' };
        const ESTADOS = {
            recibida: ['Recibida', 'bg-slate-100 text-slate-700'],
            en_revision: ['En revisión', 'bg-amber-100 text-amber-800'],
            respondida: ['Respondida', 'bg-green-100 text-green-800']
        };
        const fecha = (iso) => iso ? new Date(iso).toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' }) : '';

        document.addEventListener('DOMContentLoaded', async () => {
            if (!(await verificarSesion())) return;
            const id = new URLSearchParams(window.location.search).get('id') || '';
            const cargando = document.getElementById('cargando');
            try {
                const resp = await fetch('/api/oirs/detalle?id=' + encodeURIComponent(id), { credentials: 'same-origin' });
                if (resp.status === 401) { window.location.replace('login.html'); return; }
                const s = await resp.json();
                if (!resp.ok) throw new Error(s.error || 'No se pudo cargar la solicitud.');

                document.getElementById('numero').textContent = s.numero;
                document.getElementById('asunto').textContent = s.asunto;
                document.getElementById('meta').textContent = `${TIPOS[s.tipo] || s.tipo} · ${s.materia} · Ingresada el ${fecha(s.fecha)}`;
                document.getElementById('descripcion').textContent = s.descripcion;
                if (s.solicita) {
                    document.getElementById('solicita').textContent = s.solicita;
                    document.getElementById('bloque-solicita').classList.remove('hidden');
                }
                const est = ESTADOS[s.estado] || [s.estado, 'bg-slate-100 text-slate-700'];
                const badge = document.getElementById('estado');
                badge.textContent = est[0];
                badge.className += ' ' + est[1];
                document.getElementById('respuesta').textContent = s.respuesta
                    ? `${s.respuesta}\n\n(Respondida el ${fecha(s.fechaRespuesta)})`
                    : 'Aún no hay respuesta. Estamos revisando tu solicitud.';
                cargando.classList.add('hidden');
                document.getElementById('contenido').classList.remove('hidden');
            } catch (err) {
                cargando.classList.add('hidden');
                const e = document.getElementById('error');
                e.textContent = err.message;
                e.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
